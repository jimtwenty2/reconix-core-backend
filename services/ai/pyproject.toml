[project]
name = "reconix-ai"
version = "0.0.0"
description = "Reconix AI Service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.106.4",
    "llama-index-core>=0.14.25",
    "openai>=2.54.0",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconix_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
