# Reconix-Core local stack. Start it with:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#
# Every port is bound to 127.0.0.1 only. The Kali tool container has no published
# port and no internet: it sits only on internal networks.

name: reconix

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RECONIX_DB_NAME:-reconix}
      POSTGRES_USER: ${RECONIX_DB_USER:-reconix}
      POSTGRES_PASSWORD: ${RECONIX_DB_PASSWORD:?set RECONIX_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [backend]

  ollama:
    image: ollama/ollama:0.5.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [backend]

  kali-mcp:
    # The test image from Reconix-Kali-MCP until the first release, then a numbered tag.
    image: ${RECONIX_KALI_IMAGE:-ghcr.io/14th-generation-advanced-course/reconix-kali-mcp:dev}
    restart: unless-stopped
    environment:
      # Streamable HTTP at http://kali-mcp:8000/mcp. Without these it starts in stdio mode.
      KALI_MCP_TRANSPORT: http
      KALI_MCP_HOST: 0.0.0.0
      KALI_MCP_PORT: "8000"
      KALI_MCP_AUTH_TOKEN: ${RECONIX_MCP_ACCESS_KEY:?set RECONIX_MCP_ACCESS_KEY in .env}
      JOB_TOKEN_SECRET: ${RECONIX_JOB_TOKEN_SECRET:?set RECONIX_JOB_TOKEN_SECRET in .env}
    cap_drop: [ALL]
    # The nmap binary carries all three as file capabilities; without any one of
    # them Linux refuses to start it ("Operation not permitted").
    cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # The image has no nuclei templates and this container has no internet to fetch
      # them, so they come from the nuclei-templates volume, read-only.
      - nuclei-templates:/root/.local/nuclei-templates:ro
      # Source code from the VS Code extension (RECONIX_CODE_DIR, written by the API on
      # this computer). Read-only: semgrep and gitleaks only read it.
      - ../data/code:/workspace/code:ro
    networks: [tools, lab]

  # One-off: downloads the nuclei templates into the nuclei-templates volume. Run it once
  # after the first `up`, and again to update the templates:
  #   docker compose -f deploy/docker-compose.yml --env-file .env run --rm nuclei-templates
  # It uses the Kali image so the templates match its nuclei version, and it is the only
  # service on the `downloads` network, which has internet.
  nuclei-templates:
    image: ${RECONIX_KALI_IMAGE:-ghcr.io/14th-generation-advanced-course/reconix-kali-mcp:dev}
    profiles: [setup]
    entrypoint: ["nuclei", "-update-templates", "-update-template-dir", "/root/.local/nuclei-templates"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - nuclei-templates:/root/.local/nuclei-templates
    networks: [downloads]

networks:
  backend: {}
  # API <-> Kali MCP. internal: no route to the internet.
  tools:
    internal: true
  # Kali MCP <-> lab targets (Juice Shop, test repo). internal: no internet.
  lab:
    name: reconix-lab
    internal: true
  # Internet for the one-off nuclei-templates download only.
  downloads: {}

volumes:
  postgres-data:
  qdrant-data:
  ollama-data:
  nuclei-templates:
