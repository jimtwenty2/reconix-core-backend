# Dev only: while the API runs on the host with `uv run`, it cannot join the internal
# `tools` network. Docker never publishes a port for a container whose networks are all
# internal, so a port on `kali-mcp` itself is silently dropped. Instead a small relay sits
# on `tools` and on one non-internal network, publishes 127.0.0.1:RECONIX_MCP_PORT and
# forwards to kali-mcp:8000. The Kali container keeps no published port and no internet.
# Use it with:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --env-file .env up -d
# and set RECONIX_KALI_MCP_URL=http://127.0.0.1:<RECONIX_MCP_PORT>/mcp.
# Once the API runs in Compose (week 2), drop this file.

services:
  kali-mcp-relay:
    # Pinned by digest: a community image that sees the access key and every tool result.
    image: alpine/socat:1.8.1.1@sha256:7f9a06753033f2b7de18edc2353f2c15153413d95a039163c6db270fc7a6c3b0
    restart: unless-stopped
    command: ["TCP-LISTEN:8000,fork,reuseaddr", "TCP:kali-mcp:8000"]
    ports:
      - "127.0.0.1:${RECONIX_MCP_PORT:-8765}:8000"
    depends_on: [kali-mcp]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A relay, not a router: without this, Kali could route packets out through it.
    sysctls:
      net.ipv4.ip_forward: "0"
    networks: [mcp-host, tools]

networks:
  # Not internal, only so Docker can publish the relay's port. Nothing else joins it, and
  # nothing on it is translated to the outside, so the relay itself has no way out either.
  mcp-host:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
