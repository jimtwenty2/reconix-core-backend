[project]
name = "reconix-core"
version = "0.0.0"
description = "Reconix-Core uv workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["services/api", "services/ai", "apps/tui"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake tokens are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["reconix_api", "reconix_ai", "reconix_tui", "tests"]
